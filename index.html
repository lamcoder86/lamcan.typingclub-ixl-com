<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4d2e82" />
    <title>Blooket Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="Blooket dashboard">
          <span class="blooket-mark" aria-label="Blooket">Blooket</span>
        </a>
        <div class="profile-menu">
          <button class="profile-button" type="button" aria-haspopup="true" aria-expanded="false">
            <span class="profile-avatar" aria-hidden="true">J</span>
            <span class="profile-label">
              <span>John</span>
              <span class="games-label">Games</span>
            </span>
            <span class="profile-chevron" aria-hidden="true">⌄</span>
          </button>
          <div class="game-menu" role="menu" aria-label="Games">
            <button type="button" role="menuitem" data-game="snow-rider">
              <span>Snow Rider</span>
              <span aria-hidden="true">›</span>
            </button>
            <button type="button" role="menuitem" data-game="minecraft">
              <span>Minecraft 1.8</span>
              <span aria-hidden="true">›</span>
            </button>
            <button type="button" role="menuitem" data-game="drive-mad">
              <span>Drive Mad</span>
              <span aria-hidden="true">›</span>
            </button>
            <button type="button" role="menuitem" data-game="pac-man">
              <span>Pac-Man</span>
              <span aria-hidden="true">›</span>
            </button>
          </div>
        </div>
      </header>

      <section class="game-section" aria-labelledby="game-title">
        <div class="game-heading">
          <div>
            <p class="eyebrow">Game library</p>
            <h1 id="game-title">Snow Rider</h1>
          </div>
          <div class="game-actions">
            <a class="open-link" id="openGame" href="https://snow-rider.net/" target="_blank" rel="noopener noreferrer">
              Open game
              <span aria-hidden="true">↗</span>
            </a>
            <button class="fullscreen-button" id="fullscreenButton" type="button" aria-label="Enter fullscreen">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" />
              </svg>
              <span>Fullscreen</span>
            </button>
          </div>
        </div>

        <div class="game-frame" id="gameFrame">
          <iframe
            id="gameIframe"
            src="https://snow-rider.net/"
            title="Play Snow Rider"
            allow="fullscreen; autoplay; gamepad"
            allowfullscreen
          ></iframe>
          <div class="game-fallback" id="gameFallback" hidden>
            <div class="fallback-icon" aria-hidden="true">❄</div>
            <h2>Ready to ride?</h2>
            <p>This game host may not allow embedding. Open it in a new tab for the best experience.</p>
            <a id="fallbackGameLink" href="https://snow-rider.net/" target="_blank" rel="noopener noreferrer">Play Snow Rider</a>
          </div>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
